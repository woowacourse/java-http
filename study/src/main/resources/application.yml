handlebars:
  suffix: .html

server:
  tomcat:
    # TCP 연결 한도에 도달한 후, 새 연결 시도를 대기시킬 큐의 요청 크기
    accept-count: 10
    # Tomcat이 받아서 관리할 수 있는 TCP 연결의 한도. 스레드 개수와 무관함
    max-connections: 2

    threads:
      # 유지할 작업 스레드의 최수 개수(사용 중인 스레드 포함)
      min-spare: 2
      # 작업 스레드의 최대 개수, -> 동시 처리 가능 개수는 최대 2개
      max: 2
